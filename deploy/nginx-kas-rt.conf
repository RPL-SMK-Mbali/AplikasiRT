# ============================================================
# KAS RT ONLINE — Konfigurasi nginx (reverse proxy)
#
# Cara pakai (Ubuntu/Debian):
#   sudo cp nginx-kas-rt.conf /etc/nginx/sites-available/kas-rt
#   sudo ln -s /etc/nginx/sites-available/kas-rt /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cara pakai (CentOS/RHEL/Rocky):
#   sudo cp nginx-kas-rt.conf /etc/nginx/conf.d/kas-rt.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cara pakai (Windows):
#   Salin isi file ini ke C:\nginx\conf\kas-rt.conf,
#   lalu di dalam blok http { } pada C:\nginx\conf\nginx.conf tambahkan:
#     include kas-rt.conf;
#   Setelah itu: nginx -t lalu nginx -s reload
# ============================================================

server {
    listen 80;
    # Ganti dengan nama domain/IP Anda, atau pakai "_" agar cocok semua host
    server_name _;

    # Batas ukuran upload lampiran rapat (sesuaikan dengan limit API)
    client_max_body_size 25M;

    # Hindari masalah header besar saat banyak cookie/cookie sesi
    large_client_header_buffers 4 16k;

    location / {
        proxy_pass http://127.0.0.1:3000;

        # Wajib untuk HTTP/1.1 keep-alive & upgrade (HMR dev / websocket)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Meneruskan identitas klien asli ke aplikasi
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    # ---- OPSIONAL (disarankan): layani file statis langsung via nginx ----
    # Aktifkan blok di bawah ini setelah build produksi, sesuaikan path.
    # location /_next/static/ {
    #     alias /opt/kas-rt/.next/standalone/.next/static/;
    #     expires 365d;
    #     add_header Cache-Control "public, immutable";
    #     access_log off;
    # }
    #
    # location /logo.svg {
    #     alias /opt/kas-rt/.next/standalone/public/logo.svg;
    #     expires 7d;
    # }
}
